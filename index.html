<style>
/* ── FONT ROLES (matches ShowComm) ─────────────────────────
   Zodiak          → wordmark only
   Cabinet Grotesk → titles, device labels, buttons
   Manrope         → technical: metadata, counts, fields
──────────────────────────────────────────────────────── */
:root{
  --f-display:'Zodiak',Georgia,serif;
  --f-ui:'Cabinet Grotesk','Helvetica Neue',Arial,sans-serif;
  --f-mono:'Manrope','Helvetica Neue',Arial,sans-serif;

  --t-micro:clamp(.6rem,.62vw,.64rem);
  --t-small:clamp(.66rem,.7vw,.72rem);
  --t-body:clamp(.8rem,.88vw,.86rem);
  --t-ui:clamp(.7rem,.82vw,.76rem);
  --ls-tight:.04em; --ls-normal:.08em; --ls-wide:.14em; --ls-xwide:.2em;

  --ribbon:#111111;
  --bg:#F0F0EE; --surface:#FFFFFF; --surface-2:#F6F6F4;
  --ink:#111111; --ink-inv:#FFFFFF;
  --tx-1:rgba(0,0,0,.72); --tx-2:rgba(0,0,0,.5); --tx-3:rgba(0,0,0,.32); --tx-ghost:rgba(0,0,0,.16);
  --line:rgba(0,0,0,.08); --line-md:rgba(0,0,0,.14); --line-hi:rgba(0,0,0,.24);
  --hover:rgba(0,0,0,.035);

  --green:#22AA66; --amber:#C07818; --red:#CC2020;
  --amber-soft:rgba(192,120,24,.1); --green-soft:rgba(34,170,102,.1); --red-soft:rgba(204,32,32,.07);

  /* Device type colors — BP/IFB exact from ShowComm GLOBAL_OPTIONS */
  --bp-fg:rgb(0,255,12); --ifb-fg:rgb(169,212,152); --mic-fg:rgb(90,200,250);
  --chip-bg:#000;
  --edge:rgba(0,0,0,.22);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --edge:rgba(255,255,255,.14);
    --ribbon:#000;
    --bg:#131313; --surface:#1C1C1C; --surface-2:#232323;
    --ink:#F2F2F0; --ink-inv:#111111;
    --tx-1:rgba(255,255,255,.82); --tx-2:rgba(255,255,255,.52); --tx-3:rgba(255,255,255,.32); --tx-ghost:rgba(255,255,255,.16);
    --line:rgba(255,255,255,.07); --line-md:rgba(255,255,255,.13); --line-hi:rgba(255,255,255,.26);
    --hover:rgba(255,255,255,.04);
    --amber-soft:rgba(224,150,50,.14); --green-soft:rgba(34,170,102,.16); --red-soft:rgba(230,60,60,.12);
    --amber:#E0962E; --red:#E84A4A;
  }
}
:root[data-theme="dark"]{
  --edge:rgba(255,255,255,.14);
  --ribbon:#000;
  --bg:#131313; --surface:#1C1C1C; --surface-2:#232323;
  --ink:#F2F2F0; --ink-inv:#111111;
  --tx-1:rgba(255,255,255,.82); --tx-2:rgba(255,255,255,.52); --tx-3:rgba(255,255,255,.32); --tx-ghost:rgba(255,255,255,.16);
  --line:rgba(255,255,255,.07); --line-md:rgba(255,255,255,.13); --line-hi:rgba(255,255,255,.26);
  --hover:rgba(255,255,255,.04);
  --amber-soft:rgba(224,150,50,.14); --green-soft:rgba(34,170,102,.16); --red-soft:rgba(230,60,60,.12);
  --amber:#E0962E; --red:#E84A4A;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{height:100%;background:var(--ribbon);scroll-padding-top:env(safe-area-inset-top,0px);}
body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f-ui);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
button{font:inherit;color:inherit;}
button:focus{outline:none;}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--green);outline-offset:-2px;}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9998;opacity:.016;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='256' height='256' filter='url(%23n)'/%3E%3C/svg%3E");background-size:256px;}

#app{height:100%;display:flex;flex-direction:column;overflow:hidden;}

/* ─── RIBBON ─── */
.ribbon{background:var(--ribbon);height:52px;display:flex;align-items:stretch;flex-shrink:0;}
.r-brand{display:flex;align-items:center;padding:0 clamp(16px,2.2vw,26px);flex-shrink:0;border-right:1px solid #1e1e1e;}
.wordmark{font-family:var(--f-display);font-size:clamp(.95rem,1.2vw,1.05rem);font-weight:700;letter-spacing:.04em;color:#fff;white-space:nowrap;}
.wm-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--green);margin-left:3px;vertical-align:middle;}
.r-nav{display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;}
.r-nav::-webkit-scrollbar{display:none;}
.ribbon-tab{position:relative;display:flex;align-items:center;justify-content:center;padding:0 clamp(12px,1.6vw,20px);font-family:var(--f-ui);font-size:clamp(.66rem,.78vw,.74rem);font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:none;border:none;border-right:1px solid #1e1e1e;color:rgba(255,255,255,.34);cursor:pointer;white-space:nowrap;}
.ribbon-tab:hover{color:rgba(255,255,255,.65);}
.ribbon-tab.active{color:#fff;}
.ribbon-tab.active::after{content:'';position:absolute;bottom:0;left:clamp(12px,1.6vw,20px);right:clamp(12px,1.6vw,20px);height:2px;background:var(--green);}
.r-right{display:flex;align-items:stretch;flex-shrink:0;border-left:1px solid #1e1e1e;}
.mode-btn{display:flex;align-items:center;gap:8px;padding:0 clamp(14px,2vw,22px);font-family:var(--f-mono);font-size:var(--t-small);font-weight:700;letter-spacing:var(--ls-wide);text-transform:uppercase;background:none;border:none;color:rgba(255,255,255,.4);cursor:pointer;white-space:nowrap;}
.mode-btn:hover{color:#fff;background:rgba(255,255,255,.04);}
.mode-btn .lamp{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.25);}
.mode-btn.editing{color:#fff;}
.mode-btn.editing .lamp{background:var(--red);box-shadow:0 0 0 3px rgba(204,32,32,.25);}
@media (max-width:640px){
  .ribbon{height:auto;flex-wrap:wrap;}
  .r-brand{height:46px;border-right:none;flex:1;}
  .r-right{height:46px;border-left:none;}
  .r-nav{order:3;flex:1 0 100%;height:40px;border-top:1px solid #1e1e1e;}
  .ribbon-tab{flex:1 0 auto;}
  .ribbon-tab:last-child{border-right:none;}
}

/* ─── MAIN ─── */
.main-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.main-header{padding:clamp(14px,2vh,20px) clamp(16px,2.2vw,28px) clamp(10px,1.4vh,14px);border-bottom:3px solid var(--ink);display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--bg);}
.main-title{font-family:var(--f-ui);font-size:clamp(1.5rem,2.6vw,2.1rem);font-weight:900;letter-spacing:-.03em;color:var(--ink);line-height:1;}
.main-title-sub{font-family:var(--f-mono);font-size:var(--t-small);font-weight:500;color:var(--tx-2);letter-spacing:.02em;margin-top:5px;}
.main-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.view-pad{padding:clamp(12px,1.8vh,18px) clamp(16px,2.2vw,28px) 80px;}

/* ─── BUTTONS ─── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;font-family:var(--f-ui);font-size:.7rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;border:1px solid transparent;cursor:pointer;white-space:nowrap;border-radius:0;transition:background .1s,color .1s,border-color .1s;}
.btn.primary{background:var(--ink);color:var(--ink-inv);}
.btn.primary:hover{background:var(--green);color:#fff;}
.btn.outline{background:transparent;color:var(--tx-1);border-color:var(--line-hi);}
.btn.outline:hover{border-color:var(--ink);color:var(--ink);}
.btn.danger{background:transparent;color:var(--red);border-color:rgba(204,32,32,.35);}
.btn.danger:hover{background:var(--red);color:#fff;border-color:var(--red);}
.btn.ghost{background:transparent;color:var(--tx-2);padding:0 8px;}
.btn.ghost:hover{color:var(--ink);}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.btn.lg{height:44px;padding:0 20px;font-size:.76rem;}

/* ─── TYPE CHIP / STATUS ─── */
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:20px;padding:0 6px;background:var(--chip-bg);font-family:var(--f-mono);font-size:.62rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;flex-shrink:0;}
.chip.BP,.chip.IFB,.chip.MIC{color:#FFFFFF;}
.status{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:var(--t-micro);font-weight:800;letter-spacing:var(--ls-wide);text-transform:uppercase;white-space:nowrap;}
.status::before{content:'';width:8px;height:8px;border-radius:50%;background:currentColor;flex-shrink:0;box-sizing:border-box;}
.status.assigned{color:var(--ink);}
.status.backup{color:var(--ink);}
.status.backup::before{content:'B';width:14px;height:14px;border-radius:0;background:none;border:1.5px solid currentColor;display:inline-grid;place-items:center;font-size:9px;font-weight:800;line-height:1;letter-spacing:0;}
.status.unassigned{color:var(--tx-3);}
.status.unassigned::before{background:none;border:1.5px solid currentColor;}
.pdot{display:inline-block;width:8px;height:8px;flex-shrink:0;box-shadow:inset 0 0 0 1px var(--edge);}

/* ─── SUMMARY STRIP ─── */
.summary{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line-md);background:var(--surface);margin-bottom:14px;}
.sum-type{padding:10px 12px 10px;border-right:1px solid var(--line-md);min-width:0;}
.sum-type:last-child{border-right:none;}
.sum-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.sum-big{margin-left:auto;font-family:var(--f-ui);font-size:1.35rem;font-weight:900;letter-spacing:-.02em;line-height:1;color:var(--ink);}
.sum-big small{font-size:.8rem;font-weight:800;color:var(--tx-3);margin-left:1px;}
.sum-bar{display:flex;height:5px;background:var(--line);margin-bottom:7px;overflow:hidden;}
.sum-bar i{display:block;height:100%;}
.sum-bar .a{background:var(--ink);} .sum-bar .b{background:var(--amber);}
.sum-nums{display:flex;justify-content:space-between;gap:6px;font-family:var(--f-mono);font-size:var(--t-micro);font-weight:700;color:var(--tx-2);white-space:nowrap;}
.sum-nums .b{color:var(--amber);}
@media (max-width:420px){.sum-type{padding:9px 9px;}.sum-big{font-size:1.15rem;}.summary .chip{min-width:30px;padding:0 4px;}}

/* ─── PRODUCTION SECTIONS (board) ─── */
.psec{background:var(--surface);border:1px solid var(--line-md);border-left:5px solid var(--pc,#888);margin-bottom:10px;box-shadow:inset 1px 0 0 var(--edge);}
.psec-hdr{display:flex;align-items:center;gap:12px;padding:12px clamp(12px,1.6vw,18px);cursor:pointer;user-select:none;min-height:58px;}
.psec-hdr:hover{background:var(--hover);}
.psec-chev{font-family:var(--f-mono);font-size:.9rem;color:var(--tx-3);transition:transform .15s;width:12px;flex-shrink:0;}
.psec.open .psec-chev{transform:rotate(90deg);}
.psec-id{flex:1;min-width:0;}
.psec-name{font-family:var(--f-ui);font-size:clamp(1.15rem,1.9vw,1.5rem);font-weight:900;letter-spacing:-.02em;line-height:1;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.psec-meta{font-family:var(--f-mono);font-size:var(--t-small);font-weight:600;color:var(--tx-2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.psec-counts{display:flex;gap:6px;flex-shrink:0;}
.pc-cell{display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:42px;padding-left:10px;border-left:1px solid var(--line);}
.pc-cell .n{font-family:var(--f-ui);font-size:1.15rem;font-weight:900;line-height:1;color:var(--ink);}
.pc-cell .n small{font-size:.72rem;font-weight:800;color:var(--amber);margin-left:2px;}
.pc-cell .t{font-family:var(--f-mono);font-size:.58rem;font-weight:800;letter-spacing:.12em;color:var(--tx-3);}
.psec-body{display:none;border-top:1px solid var(--line-md);}
.psec.open .psec-body{display:block;}
.tcols{display:grid;grid-template-columns:repeat(3,1fr);}
.tcol{padding:12px clamp(12px,1.4vw,16px) 14px;border-right:1px solid var(--line);min-width:0;}
.tcol:last-child{border-right:none;}
.tcol-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.tcol-title{font-family:var(--f-mono);font-size:var(--t-micro);font-weight:800;letter-spacing:var(--ls-wide);text-transform:uppercase;color:var(--tx-2);}
.tcol-count{margin-left:auto;font-family:var(--f-mono);font-size:var(--t-micro);font-weight:700;color:var(--tx-3);}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;}
.tile{display:flex;background:var(--surface-2);border:1px solid var(--line);border-bottom:2px solid var(--line-md);cursor:pointer;text-align:left;min-width:0;padding:0;width:100%;}
.tile:hover{border-color:var(--line-hi);}
.tile-strip{width:4px;flex-shrink:0;background:var(--pc,#888);box-shadow:inset -1px 0 0 var(--edge);}
.tile-strip.split{display:flex;flex-direction:column;background:none;width:5px;}
.tile-strip.split i{flex:1;}
.tile-in{padding:7px 8px 6px;min-width:0;flex:1;}
.tile-label{font-family:var(--f-ui);font-size:.95rem;font-weight:800;letter-spacing:-.01em;line-height:1;color:var(--ink);}
.tile-who{font-family:var(--f-mono);font-size:.64rem;font-weight:600;color:var(--tx-2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:.9em;}
.tile-who.none{color:var(--tx-ghost);}
.tile{position:relative;}
.tile-label,.tile-who{display:block;}
.tiles.compact{grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:4px;}
.tiles.compact .tile-in{padding:8px 7px;}
.tiles.compact .tile-label{font-size:.9rem;}
.tile-note{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--amber);}
.bench{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line-hi);display:flex;align-items:flex-start;gap:10px;}
.bench-label{font-family:var(--f-mono);font-size:var(--t-micro);font-weight:800;letter-spacing:var(--ls-wide);text-transform:uppercase;color:var(--amber);padding-top:6px;white-space:nowrap;flex-shrink:0;}
.bench-label span{color:var(--tx-3);margin-left:3px;}
.bench-chips{display:flex;flex-wrap:wrap;gap:4px;min-width:0;}
.bchip{display:inline-flex;align-items:baseline;gap:6px;font-family:var(--f-ui);font-size:.82rem;font-weight:800;color:var(--ink);background:var(--surface);border:1px solid var(--line-md);border-left:3px solid var(--amber);padding:5px 8px;cursor:pointer;}
.bchip:hover{border-color:var(--line-hi);border-left-color:var(--amber);}
.bchip em{font-style:normal;font-family:var(--f-mono);font-size:.62rem;font-weight:600;color:var(--tx-2);}
.psec-tools{display:flex;gap:6px;justify-content:flex-end;padding:10px clamp(12px,1.4vw,16px) 0;}
.btn.sm{height:28px;padding:0 10px;font-size:.62rem;}
.free.on{background:var(--ink);color:var(--ink-inv);border-color:var(--ink);}
.pk-type{margin-bottom:14px;}
.pk-type .tcol-head .btn{margin-left:4px;}
.seg.two{grid-template-columns:1fr 1fr;}
.xp-list{display:flex;flex-direction:column;gap:6px;}
.xp{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface-2);border:1px solid var(--line-md);border-left:4px solid var(--pc,var(--ink));padding:11px 12px;cursor:pointer;width:100%;}
.xp-sub{font-family:var(--f-mono);font-size:var(--t-micro);font-weight:800;letter-spacing:var(--ls-wide);text-transform:uppercase;color:var(--tx-3);padding:10px 2px 2px;}
.xp-prod{display:flex;align-items:center;gap:12px;background:var(--surface-2);border:1px solid var(--line-md);border-left:4px solid var(--pc,var(--ink));padding:8px 8px 8px 12px;box-shadow:inset 1px 0 0 var(--edge);}
.xp-pn{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.xp-pn b{font-family:var(--f-ui);font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.xp-pn i{font-style:normal;font-family:var(--f-mono);font-size:var(--t-micro);color:var(--tx-2);}
.xp-acts{display:flex;gap:4px;flex-shrink:0;}
.xp-b{min-height:40px;padding:0 10px;font-family:var(--f-mono);font-size:var(--t-micro);font-weight:800;letter-spacing:var(--ls-wide);text-transform:uppercase;background:var(--surface);color:var(--ink);border:1px solid var(--line-hi);cursor:pointer;}
.xp-b:hover{border-color:var(--ink);}
.qr-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:6px 0;}
.qr-svg{display:block;width:min(240px,70vw);height:auto;border:1px solid var(--line-md);}
.qr-url{font-family:var(--f-mono);font-size:var(--t-small);color:var(--tx-2);word-break:break-all;text-align:center;}
.xp:hover{border-color:var(--line-hi);border-left-color:var(--pc,var(--ink));}
.xp-kind{font-family:var(--f-mono);font-size:.6rem;font-weight:800;letter-spacing:.1em;background:var(--ink);color:var(--ink-inv);padding:3px 6px;flex-shrink:0;min-width:40px;text-align:center;}
.xp b{display:block;font-family:var(--f-ui);font-size:1rem;font-weight:900;color:var(--ink);letter-spacing:-.01em;}
.xp i{display:block;font-style:normal;font-family:var(--f-mono);font-size:var(--t-small);font-weight:500;color:var(--tx-2);margin-top:2px;}
.tcol-empty{font-family:var(--f-mono);font-size:var(--t-small);color:var(--tx-3);padding:6px 0;}
@media (max-width:760px){.tcols{grid-template-columns:1fr;}.tcol{border-right:none;border-bottom:1px solid var(--line);}.tcol:last-child{border-bottom:none;}}
@media (max-width:520px){.psec-counts .pc-cell{min-width:34px;padding-left:7px;}.pc-cell .n{font-size:1rem;}}

.pool{border:1px dashed var(--line-hi);background:transparent;margin-top:18px;}
.pool .psec-hdr{cursor:pointer;}
.pool .psec-name{color:var(--tx-2);}
.free-list{display:flex;flex-wrap:wrap;gap:4px;}
.free{font-family:var(--f-mono);font-size:.7rem;font-weight:700;padding:4px 7px;border:1px solid var(--line-md);background:var(--surface);color:var(--tx-1);cursor:pointer;}
.free:hover{border-color:var(--ink);}

/* ─── FILTER BAR ─── */
.fbar{display:flex;align-items:stretch;border-bottom:2px solid var(--ink);background:var(--surface);min-height:44px;position:sticky;top:0;z-index:5;}
.f-search{display:flex;align-items:center;gap:8px;padding:0 clamp(12px,1.6vw,18px);border-right:1px solid var(--line-md);min-width:170px;flex:1 1 170px;}
.f-search input{background:transparent;border:none;outline:none;color:var(--ink);font-family:var(--f-mono);font-size:var(--t-body);font-weight:600;width:100%;padding:10px 0;}
.f-search input::placeholder{color:var(--tx-3);font-weight:500;}
.f-rest{display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none;flex:0 1 auto;min-width:0;}
.f-rest::-webkit-scrollbar{display:none;}
.f-sec{display:flex;align-items:stretch;border-right:1px solid var(--line-md);flex-shrink:0;}
@media (max-width:640px){.fbar{flex-direction:column;}.f-search{flex:0 0 auto;border-right:none;border-bottom:1px solid var(--line-md);min-height:44px;}.f-rest{min-height:40px;}}
.f-pill{display:flex;align-items:center;padding:0 clamp(9px,1vw,12px);font-family:var(--f-mono);font-size:var(--t-micro);font-weight:700;letter-spacing:var(--ls-normal);text-transform:uppercase;border:none;background:transparent;color:var(--tx-2);cursor:pointer;white-space:nowrap;}
.f-pill:hover{color:var(--ink);background:var(--hover);}
.f-pill.active{color:var(--ink-inv);background:var(--ink);font-weight:800;}
.f-select{display:flex;align-items:center;padding:0 10px;border-right:1px solid var(--line-md);flex-shrink:0;}
.f-select select{background:transparent;border:none;color:var(--ink);font-family:var(--f-mono);font-size:var(--t-small);font-weight:700;outline:none;padding:6px 2px;max-width:170px;}
.f-select select option{color:#111;background:#fff;}
.f-clear{display:flex;align-items:center;padding:0 12px;flex-shrink:0;}

/* ─── INVENTORY LIST ─── */
.inv-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px clamp(16px,2.2vw,28px);font-family:var(--f-mono);font-size:var(--t-small);font-weight:600;color:var(--tx-2);}
.inv-list{padding:0 clamp(16px,2.2vw,28px) 110px;}
.row{display:grid;grid-template-columns:auto 44px minmax(64px,.8fr) 120px minmax(90px,1.2fr) minmax(90px,1.4fr);align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line-md);border-left:4px solid var(--pc,var(--line-md));padding:9px 14px;margin-bottom:3px;cursor:pointer;min-height:46px;}
.row-sub{display:contents;}
.row:hover{border-color:var(--line-hi);border-left-color:var(--pc,var(--line-hi));}
.row.sel{background:var(--green-soft);border-color:var(--green);}
.row-check{width:18px;height:18px;border:2px solid var(--line-hi);display:none;align-items:center;justify-content:center;flex-shrink:0;}
.selecting .row-check{display:flex;}
.row.sel .row-check{background:var(--green);border-color:var(--green);}
.row.sel .row-check::after{content:'';width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px);}
.row-label{font-family:var(--f-ui);font-size:1.1rem;font-weight:800;letter-spacing:-.01em;color:var(--ink);line-height:1;}
.row-prod{display:flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:var(--t-small);font-weight:700;color:var(--tx-1);min-width:0;}
.row-prod span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row-who{font-family:var(--f-mono);font-size:var(--t-small);font-weight:600;color:var(--tx-2);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row-who em{font-style:normal;color:var(--tx-3);}
.dash{color:var(--tx-ghost);}
@media (max-width:760px){
  .row{grid-template-columns:auto 40px 1fr auto;grid-template-areas:"ck chip label status" "ck sub sub sub";row-gap:4px;column-gap:10px;padding:8px 12px;min-height:0;}
  .row-check{grid-area:ck;} .row .chip{grid-area:chip;} .row-label{grid-area:label;font-size:1rem;} .row .status{grid-area:status;}
  .row-sub{grid-area:sub;display:flex;gap:10px;min-width:0;align-items:center;}
  .row-sub:has(> .row-prod:empty):has(> .row-who:empty){display:none;}
  .row-who:empty,.row-prod:empty{display:none;}
  .row-prod{flex-shrink:0;max-width:55%;}
}

/* ─── BULK BAR ─── */
.bulkbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:2px solid var(--ink);display:none;align-items:center;gap:8px;padding:12px clamp(14px,2vw,24px);padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));flex-wrap:wrap;}
.bulkbar.show{display:flex;}
.bulk-count{font-family:var(--f-mono);font-size:var(--t-small);font-weight:800;letter-spacing:var(--ls-normal);text-transform:uppercase;color:var(--ink);margin-right:auto;}

/* ─── PRODUCTIONS VIEW ─── */
.prod-card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line-md);border-left:5px solid var(--pc,#888);padding:14px 16px;margin-bottom:8px;cursor:pointer;}
.prod-card:hover{background:var(--hover);}
.prod-card.archived{opacity:.55;}
.prod-main{flex:1;min-width:0;}
.prod-name{font-family:var(--f-ui);font-size:1.25rem;font-weight:900;letter-spacing:-.02em;line-height:1;color:var(--ink);}
.prod-meta{font-family:var(--f-mono);font-size:var(--t-small);font-weight:600;color:var(--tx-2);margin-top:5px;}
.prod-notes{font-family:var(--f-mono);font-size:var(--t-small);font-weight:500;color:var(--tx-3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sub-head{font-family:var(--f-mono);font-size:var(--t-micro);font-weight:800;letter-spacing:var(--ls-xwide);text-transform:uppercase;color:var(--tx-2);margin:22px 0 10px;}

/* ─── LOG ─── */
.log-item{display:grid;grid-template-columns:120px 1fr;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);}
.log-time{font-family:var(--f-mono);font-size:var(--t-small);font-weight:600;color:var(--tx-3);}
.log-text{font-family:var(--f-mono);font-size:var(--t-body);font-weight:600;color:var(--tx-1);line-height:1.45;}

try{ SB = window.supabase.createClient(SB_URL, SB_KEY, {auth:{storageKey:'showgear-auth'}}); }catch(e){ console.error('Supabase init failed:', e); }

const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{ const r=Math.random()*16|0; return (c==='x'?r:(r&3|8)).toString(16); });
const now = () => new Date().toISOString();
function emptyData(){ return {productions:[], devices:[], log:[]}; }
let DB = emptyData();

const inProd = (d, pid) => d.pids.includes(pid);
/* Dark or light text, whichever reads better on a production color */
function fgOn(hex){
  const h = String(hex||'#888888').replace('#','');
  const L = [0,2,4].map(i=>parseInt(h.slice(i,i+2),16)/255).map(c=>c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4));
  return (0.2126*L[0]+0.7152*L[1]+0.0722*L[2]) > 0.179 ? '#111111' : '#FFFFFF';
}
/* A shared device's productions in board/column order, so its split looks the same everywhere */
function sortedProds(d){
  const o = {}; activeProds().forEach((p,i)=>o[p.id]=i);
  return prodsOf(d).slice().sort((a,b)=>(o[a.id]??99)-(o[b.id]??99));
}

  DIRTY.prod.clear(); DIRTY.dev.clear(); DIRTY.delDev.clear(); DIRTY.delProd.clear();
  if(!prods.length && !devs.length && !delDevs.length && !delProds.length && !logs.length) return;
  // Every write verifies its row count — a permissions block returns no error, just zero rows
  const expect = (r, n, what) => { if(r.error) throw r.error; if(!r.data || r.data.length !== n) throw new Error(what+': wrote '+(r.data?r.data.length:0)+' of '+n); };
  try{
    if(!SB) throw new Error('Supabase unavailable');
    if(prods.length) expect(await SB.from('gear_productions').upsert(prods.map(prodToRow)).select('id'), prods.length, 'productions');
    if(devs.length) expect(await SB.from('gear_devices').upsert(devs.map(devToRow)).select('id'), devs.length, 'devices');
    if(delDevs.length) expect(await SB.from('gear_devices').delete().in('id', delDevs).select('id'), delDevs.length, 'device deletes');
    if(delProds.length) expect(await SB.from('gear_productions').delete().in('id', delProds).select('id'), delProds.length, 'production deletes');
    if(logs.length){ const r = await SB.from('gear_log').insert(logs.map(text=>({text}))); if(r.error) throw r.error; }
  }catch(e){
    console.error('ShowGear save failed:', e);
    toast('Couldn’t save. Reloading the latest data.', true);
    try{ await loadAll(); }catch(_){}
    render();
  }
}

function logEvent(text){
  DB.log.unshift({id:uid(), ts:now(), text});
  if(DB.log.length > 300) DB.log.length = 300;

/* Single mutation point for device state */
function setDeviceState(dev, status, pids, assignee, note){
  pids = [...new Set(Array.isArray(pids) ? pids : (pids ? [pids] : []))];
  if(status==='unassigned' || !pids.length){ status='unassigned'; pids=[]; assignee=''; }
  const before = describeState(dev);
  dev.status = status; dev.pids = pids; dev.assignee = (assignee||'').trim();
  if(note!==undefined) dev.note = (note||'').trim();
  dev.updatedAt = now(); markDev(dev);
  const after = describeState(dev);
  return before !== after ? after : null;
}
function describeState(d){
  if(d.status==='unassigned') return 'unassigned';
  return (d.status==='backup'?'set as backup for ':'assigned to ') + (prodNames(d)||'?') + (d.assignee?' ('+d.assignee+')':'');
}

function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso+'T12:00:00');
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
}
function fmtRange(p){
  if(!p.start && !p.end) return 'No dates set';
  if(p.start && !p.end) return 'From '+fmtDate(p.start);
  if(!p.start && p.end) return 'Until '+fmtDate(p.end);
  const a = new Date(p.start+'T12:00:00'), b = new Date(p.end+'T12:00:00');
  const yr = b.getFullYear();
  if(a.getMonth()===b.getMonth() && a.getFullYear()===b.getFullYear())
    return a.toLocaleDateString(undefined,{month:'short'})+' '+a.getDate()+'–'+b.getDate()+', '+yr;
  return fmtDate(p.start)+' – '+fmtDate(p.end)+', '+yr;
}
function fmtTime(iso){
  const d = new Date(iso);
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
}
function toast(msg, bad){

  DB.devices.forEach(d=>{ if(inProd(d,pid)){ c[d.type][d.status==='backup'?'b':'a']++; } });

/* Batched log: rapid taps become one line per production/action */
const MXLOG = {}; let mxLogTimer = null;
function mxQueueLog(label, status, pid){
  const k = status==='unassigned' ? 'u|' : status+'|'+pid;   // status: assigned | backup | share | unshare | unassigned
  (MXLOG[k] = MXLOG[k] || []).push(label);
  clearTimeout(mxLogTimer); mxLogTimer = setTimeout(mxFlushLog, 2500);
}
function mxFlushLog(){
  const keys = Object.keys(MXLOG); if(!keys.length) return;
  keys.forEach(k=>{
    const [st, pid] = k.split('|'), p = prodById(pid);
    const labels = [...new Set(MXLOG[k])].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
    const verb = {backup:'set as backup for ', share:'shared with ', unshare:'removed from ', assigned:'assigned to '}[st] || 'assigned to ';
    logEvent(`${compactLabels(labels)} ${st==='u'?'unassigned':verb+(p?p.name:'?')}`);
    delete MXLOG[k];
  });
  save();
}
/* Route one device. kind: assign (free→this show), cycle (single show), share (add this show),
   unshare (drop this show only), move (this show only, as assigned) */
function mxRouteOne(d, pid, kind){
  if(kind==='share'){ if(d.pids.length>=MAX_SHARE) return false; setDeviceState(d, d.status, [...d.pids, pid], d.assignee); mxQueueLog(d.label,'share',pid); return; }
  if(kind==='unshare'){ setDeviceState(d, d.status, d.pids.filter(x=>x!==pid), d.assignee); mxQueueLog(d.label,'unshare',pid); return; }
  if(kind==='move'){ setDeviceState(d, 'assigned', [pid], ''); mxQueueLog(d.label,'assigned',pid); return; }
  if(kind==='assign'){ setDeviceState(d, 'assigned', inProd(d,pid)?d.pids:[...d.pids,pid], inProd(d,pid)?d.assignee:''); mxQueueLog(d.label,'assigned',pid); return; }
  // cycle within a single show: assigned -> backup -> clear
  if(d.status==='assigned'){ setDeviceState(d, 'backup', [pid], d.assignee); mxQueueLog(d.label,'backup',pid); }
  else { setDeviceState(d, 'unassigned', [], ''); mxQueueLog(d.label,'unassigned',pid); }
}
function mxApply(list, pid, kind){ list.forEach(d=>mxRouteOne(d, pid, kind)); save(); render(); }
function mxTap(devId, pid){
  const d = devById(devId), p = prodById(pid); if(!d || !p) return;
  if(UI.mx.range) return mxRangeTap(d, p);
  const here = inProd(d, pid);
  if(!here && d.pids.length){
    const full = d.pids.length >= MAX_SHARE;
    actionToast(`${d.label} is ${d.status==='backup'?'a backup for':'on'} ${prodNames(d)||'another production'}${full?`. That's the limit of ${MAX_SHARE} shows, so it can only move.`:''}`, [
      ...(full ? [] : [{label:'Share', fn:()=>{ mxApply([d], pid, 'share'); toast(`${d.label} shared with ${p.name}`); }}]),
      {label:'Move here', fn:()=>{ mxApply([d], pid, 'move'); toast(`${d.label} moved to ${p.name}`); }}]);
    return;
  }
  if(here && d.pids.length>1){   // shared: a tap un-shares it from this show only; other shows untouched
    mxApply([d], pid, 'unshare'); toast(`${d.label} removed from ${p.name}. Still on ${prodNames(d)}.`); return;
  }
  mxApply([d], pid, here ? 'cycle' : 'assign');
}
function mxRangeTap(d, p){
  const M = UI.mx;
  if(!M.anchor){ M.anchor = {id:d.id, pid:p.id}; render(); return; }
  const a = devById(M.anchor.id);
  if(M.anchor.pid!==p.id || !a || a.type!==d.type){
    M.anchor = {id:d.id, pid:p.id}; render();
    toast('Range needs both ends in the same column and device type. Start set here.', true); return;
  }
  const list = (mxVisibleRows().find(([t])=>t===d.type)||[null,[]])[1];
  let i = list.findIndex(x=>x.id===a.id), j = list.findIndex(x=>x.id===d.id); if(i>j) [i,j] = [j,i];
  const span = list.slice(i, j+1);
  const targets = span.filter(x=>!(inProd(x,p.id) && x.status==='assigned'));
  const conflicts = targets.filter(x=>x.pids.length && !inProd(x,p.id));
  const plain = targets.filter(x=>!conflicts.includes(x));
  M.range = false; M.anchor = null;
  const done = (mode) => {
    const n = plain.length + (mode==='skip' ? 0 : conflicts.length);
    if(!n){ render(); toast('Nothing to change'); return; }
    plain.forEach(x=>mxRouteOne(x, p.id, 'assign'));
    let full = 0;
    if(mode!=='skip') conflicts.forEach(x=>{ if(mxRouteOne(x, p.id, mode)===false) full++; });
    save(); render();
    toast(`${span[0].label} to ${span[span.length-1].label}: ${n-full} routed to ${p.name}` + (full?`. ${full} already on ${MAX_SHARE} shows, left as is`:''));
  };
  if(conflicts.length){
    render();
    actionToast(`${conflicts.length} of ${span.length} ${conflicts.length===1?'is':'are'} on another production`,
      [{label:'Share them', fn:()=>done('share')}, {label:'Move them', fn:()=>done('move')}, {label:'Skip them', fn:()=>done('skip')}]);
  } else done('skip');
}

    const pre = $('#gPrefix').value.trim().toUpperCase(), a = +$('#gFrom').value, b = +$('#gTo').value, pad = +$('#gPad').value;
    const L = n => pre + String(n).padStart(pad,'0');
    if(!pre || !Number.isFinite(a) || !Number.isFinite(b) || b<a){ $('#gPreview').textContent=''; return; }
    const labels = []; for(let i=a;i<=b;i++) labels.push(L(i));
    const dup = labels.filter(l=>DB.devices.some(d=>d.label.toUpperCase()===l)).length;
    $('#gPreview').textContent = `${labels.length} device${labels.length===1?'':'s'}: ${L(a)} to ${L(b)}` + (dup?`. ${dup} already exist and will be skipped.`:'.');
  };
  $('#gType').onchange = setDefaults;
  ['gPrefix','gFrom','gTo','gPad'].forEach(id=>$('#'+id).addEventListener('input', preview));
  setDefaults();
  $('#gAdd').onclick = () => {
    const type = $('#gType').value, pre = $('#gPrefix').value.trim().toUpperCase(), a = +$('#gFrom').value, b = +$('#gTo').value, pad = +$('#gPad').value, model = $('#gModel').value.trim();
    if(!pre){ $('#gErr').textContent='Add a prefix.'; return; }
    if(!Number.isFinite(a)||!Number.isFinite(b)||b<a){ $('#gErr').textContent='“To” has to be at least “From”.'; return; }
    if(b-a>199){ $('#gErr').textContent='Add up to 200 at a time.'; return; }
    const added = [];
    for(let i=a;i<=b;i++){
      const label = pre+String(i).padStart(pad,'0');
      if(DB.devices.some(d=>d.label.toUpperCase()===label)) continue;
      const nd = {id:uid(), type, label, model, serial:'', status:'unassigned', pids:[], assignee:'', note:'', updatedAt:now()};
      DB.devices.push(nd); markDev(nd);
      added.push(label);
    }
    if(!added.length){ $('#gErr').textContent='All of those already exist.'; return; }
    logEvent(added.length===1 ? `${added[0]} added` : `${added[0]} to ${added[added.length-1]} added (${added.length})`);
    save(); closeModal(); render(); toast(`Added ${added.length} ${TYPE_NAME[type].toLowerCase()}`);
  };
}

const LIBS = {
  xlsx:[ 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js', 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js' ],
  jspdf:[ 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', 'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js' ],
  autotable:[ 'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js', 'https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js' ]
};
const loaded = {};
function loadLib(name){
  if(loaded[name]) return loaded[name];
  loaded[name] = (async () => {
    for(const url of LIBS[name]){
      try{
        await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=url; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
        return;
      }catch(e){}
    }
    delete loaded[name]; throw new Error('load');
  })();
  return loaded[name];
}
async function saveFile(filename, data){
  let dl = null;
  if(window.claude && typeof window.claude.use==='function'){ try{ dl = await window.claude.use('downloads'); }catch(e){ dl = null; } }
  if(dl){
    try{ await dl.save({filename, data}); toast('Saved '+filename); }
    catch(e){ if(e && e.code==='declined') return; toast(e && e.code==='rate_limited' ? 'A save prompt is already open' : 'Couldn’t save the file here', true); }
    return;
  }
  const blob = data instanceof Blob ? data : new Blob([data]);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  toast('Downloaded '+filename);
}

async function exportXlsx(){
  busy('Building workbook…');
  try{ await loadLib('xlsx'); }catch(e){ toast('Couldn’t load the Excel tools. Check your connection.', true); return; }
  const X = window.XLSX, wb = X.utils.book_new();
  const prods = activeProds();
  // Summary
  const sum = [['ShowGear summary', '', '', '', '', '', '', ''], ['Exported', longStamp()], [],
    ['Production','Dates','Location','BP assigned','BP backup','MIC assigned','MIC backup','IFB assigned','IFB backup']];
  prods.forEach(p=>{ const c=countFor(p.id); sum.push([p.name, fmtRange(p), p.location||'', c.BP.a, c.BP.b, c.MIC.a, c.MIC.b, c.IFB.a, c.IFB.b]); });
  const free = t => DB.devices.filter(d=>d.type===t && d.status==='unassigned').length;
  const tot = t => DB.devices.filter(d=>d.type===t).length;
  sum.push([], ['Unassigned','','', free('BP'),'', free('MIC'),'', free('IFB'),''], ['Total owned','','', tot('BP'),'', tot('MIC'),'', tot('IFB'),'']);
  const ws1 = X.utils.aoa_to_sheet(sum); ws1['!cols']=[{wch:28},{wch:20},{wch:18},{wch:12},{wch:10},{wch:12},{wch:10},{wch:12},{wch:10}];
  X.utils.book_append_sheet(wb, ws1, 'Summary');
  // All gear
  const head = ['Type','Device','Status','Production','Assigned to','Note','Model','Serial','Updated'];
  const rowOf = d => { return [d.type, d.label, STATUS_NAME[d.status], prodNames(d), d.assignee, d.note, d.model, d.serial, fmtTime(d.updatedAt)]; };
  const ws2 = X.utils.aoa_to_sheet([head, ...DB.devices.slice().sort(byLabel).map(rowOf)]);
  ws2['!cols']=[{wch:6},{wch:9},{wch:11},{wch:24},{wch:20},{wch:32},{wch:14},{wch:14},{wch:18}];
  ws2['!autofilter']={ref: X.utils.encode_range({s:{r:0,c:0},e:{r:DB.devices.length,c:head.length-1}})};
  X.utils.book_append_sheet(wb, ws2, 'All gear');
  // Per production
  const used = new Set(['Summary','All gear']);
  prods.forEach(p=>{
    const rows = [[p.name], [fmtRange(p)+(p.location?'  /  '+p.location:'')], [], ['Type','Device','Status','Assigned to','Note']];
    TYPES.forEach(t=>{
      const list = DB.devices.filter(d=>inProd(d,p.id) && d.type===t).sort((a,b)=>(a.status==='backup')-(b.status==='backup')||byLabel(a,b));
      list.forEach(d=>rows.push([t, d.label, STATUS_NAME[d.status], d.assignee, d.note]));
    });
    const ws = X.utils.aoa_to_sheet(rows); ws['!cols']=[{wch:6},{wch:9},{wch:11},{wch:22},{wch:36}];
    let name = (p.code||p.name).replace(/[\\\/\?\*\[\]:]/g,'').slice(0,31) || 'Production'; let n=2;
    while(used.has(name)) name = name.slice(0,28)+' '+(n++); used.add(name);
    X.utils.book_append_sheet(wb, ws, name);
  });
  const out = X.write(wb, {bookType:'xlsx', type:'array'});
  await saveFile(`ShowGear-${stamp()}.xlsx`, new Blob([out]));
}

function hexRgb(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function pdfHeader(doc, title, sub, color, qrText){
  const W = doc.internal.pageSize.getWidth();
  doc.setFillColor(17,17,17); doc.rect(0,0,W,78,'F');
  if(qrText) pdfQr(doc, qrText, W-36-66, 6, 66);
  if(color){ doc.setFillColor(...hexRgb(color)); doc.rect(0,0,8,78,'F'); }
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(8);
  doc.setCharSpace(1.5); doc.text('SHOWGEAR', 36, 26); doc.setCharSpace(0);
  doc.setFontSize(22); doc.text(title, 36, 52);
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(170,170,170); doc.text(sub, 36, 67);
  doc.setFontSize(8); doc.text('Exported '+longStamp(), qrText ? W-36-66-14 : W-36, 26, {align:'right'});
  if(qrText){ doc.setFontSize(7); doc.text('Scan for the live board', W-36-66-14, 38, {align:'right'}); }
}
function pdfFooter(doc){
  const n = doc.internal.getNumberOfPages(), W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(140,140,140); doc.text(`Page ${i} of ${n}`, W-36, H-20, {align:'right'}); }
}
const TABLE = {
  theme:'grid', margin:{left:36,right:36},
  styles:{font:'helvetica', fontSize:9, cellPadding:{top:5,bottom:5,left:6,right:6}, lineColor:[215,215,212], lineWidth:.5, textColor:[30,30,30]},
  headStyles:{fillColor:[236,236,233], textColor:[17,17,17], fontStyle:'bold', fontSize:7.5}
};
const HEAD_LIGHT = {fillColor:[236,236,233], textColor:[17,17,17]};
/* A narrow table printed as two side-by-side columns (top half left, bottom half right) to halve the length */
function twoUp(doc, y, list, head, row, colStyles, headStyle, extra){
  const W = doc.internal.pageSize.getWidth(), gap = 16, w = (W-72-gap)/2;
  const half = Math.ceil(list.length/2), parts = [list.slice(0,half), list.slice(half)];
  const page = doc.internal.getNumberOfPages ? doc.internal.getNumberOfPages() : 1;
  let end = y;
  parts.forEach((part, i)=>{
    if(!part.length) return;
    if(doc.setPage) doc.setPage(page);
    const left = 36 + i*(w+gap);
    doc.autoTable({...TABLE, ...(extra||{}), startY:y, margin:{left, right:W-left-w}, head:[head], body:part.map(row),
      headStyles:{...TABLE.headStyles, ...headStyle}, columnStyles:colStyles});
    end = Math.max(end, doc.lastAutoTable.finalY);
  });
  return end;
}
const HEAD_BACKUP = {fillColor:[192,120,24], textColor:[255,255,255]};
function sectionTitle(doc, y, text, right){
  const W = doc.internal.pageSize.getWidth();
  if(y > doc.internal.pageSize.getHeight()-90){ doc.addPage(); y = 50; }
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(17,17,17); doc.text(text, 36, y);
  if(right){ doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(120,120,120); doc.text(right, W-36, y, {align:'right'}); }
  doc.setDrawColor(17,17,17); doc.setLineWidth(1.5); doc.line(36, y+5, W-36, y+5);
  return y+12;
}

async function exportProdPdf(pid){
  const p = prodById(pid); if(!p) return;
  busy('Building PDF…');
  let jsPDF; try{ jsPDF = await pdfLibs(); }catch(e){ toast('Couldn’t load the PDF tools. Check your connection.', true); return; }
  const doc = new jsPDF({unit:'pt', format:'letter'});
  pdfHeader(doc, p.name, [fmtRange(p), p.location].filter(Boolean).join('  /  '), p.color, prodUrl(p));
  let y = 108;
  if(p.notes){ doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(90,90,90); doc.text(doc.splitTextToSize('Notes: '+p.notes, doc.internal.pageSize.getWidth()-72), 36, y); y += 24; }
  const H = doc.internal.pageSize.getHeight(), COLS = 8, ROW = 20;
  const also = d => sortedProds(d).filter(x=>x.id!==p.id).map(x=>x.code||x.name);
  const lbl = d => { const a = also(d); return a.length ? `${d.label}  +${a.join(' ')}` : d.label; };
  TYPES.forEach(t=>{
    const prim = DB.devices.filter(d=>inProd(d,p.id) && d.type===t && d.status==='assigned').sort(byLabel);
    const bk = DB.devices.filter(d=>inProd(d,p.id) && d.type===t && d.status==='backup').sort(byLabel);
    if(!prim.length && !bk.length) return;
    // Each list decides: nothing written in "Assigned to" or "Note"? A compact grid of labels instead of empty columns
    const isCompact = list => list.every(d=>!d.assignee);
    const rowsFor = list => isCompact(list) ? Math.ceil(list.length/COLS) : Math.ceil(list.length/2);
    const est = 24 + (prim.length ? (rowsFor(prim)+1)*ROW+10 : 0) + (bk.length ? (rowsFor(bk)+1)*ROW+10 : 0);
    if(y + est > H - 40 && est < H - 110){ doc.addPage(); y = 50; }   // keep a short section on one page
    y = sectionTitle(doc, y, TYPE_NAME[t], `${prim.length} assigned${bk.length?', '+bk.length+' backup':''}`);
    const grid = (list, head, fill) => {
      const body = []; for(let k=0;k<list.length;k+=COLS){ const r = list.slice(k,k+COLS).map(lbl); while(r.length<COLS) r.push(''); body.push(r); }
      const cw = (doc.internal.pageSize.getWidth()-72)/COLS, colStyles = {}; for(let k=0;k<COLS;k++) colStyles[k] = {cellWidth:cw};
      doc.autoTable({...TABLE, startY:y, head:[[{content:head, colSpan:COLS}]], body, headStyles:{...TABLE.headStyles, ...fill},
        styles:{...TABLE.styles, fontStyle:'bold', halign:'left'}, columnStyles:colStyles});
      y = doc.lastAutoTable.finalY + 10;
    };
    const table = (list, head, fill) => {
      y = twoUp(doc, y, list, [head,'Assigned to'], d=>[lbl(d), d.assignee||''], {0:{cellWidth:92, fontStyle:'bold'}}, fill) + 10;
    };
    if(prim.length) (isCompact(prim)?grid:table)(prim, isCompact(prim)?'Assigned':'Device', HEAD_LIGHT);
    if(bk.length) (isCompact(bk)?grid:table)(bk, 'Backup', HEAD_BACKUP);
    y += 16;
  });
  if(!DB.devices.some(d=>inProd(d,p.id))){ doc.setFontSize(10); doc.setTextColor(120,120,120); doc.text('No gear assigned yet.', 36, y); }
  pdfFooter(doc);
  await saveFile(`ShowGear-${slug(p.code||p.name)}-${stamp()}.pdf`, doc.output('blob'));
}

/* Checkout checklist: Out / In boxes and initials per device, sign-off at the end */
async function exportChecklistPdf(pid){
  const p = prodById(pid); if(!p) return;
  busy('Building checklist…');
  let jsPDF; try{ jsPDF = await pdfLibs(); }catch(e){ toast('Couldn’t load the PDF tools. Check your connection.', true); return; }
  const doc = new jsPDF({unit:'pt', format:'letter'});

  let y = 100;
  const also = d => sortedProds(d).filter(x=>x.id!==p.id).map(x=>x.code||x.name);
  const lbl = d => { const a = also(d); return a.length ? `${d.label}  +${a.join(' ')}` : d.label; };
  const box = (data) => { if(data.section==='body' && (data.column.index===2 || data.column.index===3)){
      const s=10, cx=data.cell.x+(data.cell.width-s)/2, cy=data.cell.y+(data.cell.height-s)/2;
      doc.setDrawColor(60,60,60); doc.setLineWidth(.8); doc.rect(cx, cy, s, s, 'S'); } };
  const cols = {0:{cellWidth:92, fontStyle:'bold'}, 2:{cellWidth:30, halign:'center'}, 3:{cellWidth:30, halign:'center'}};
  let any = false;
  TYPES.forEach(t=>{
    const prim = DB.devices.filter(d=>inProd(d,p.id) && d.type===t && d.status==='assigned').sort(byLabel);

    if(!prim.length && !bk.length) return; any = true;
    const est = 24 + (prim.length ? (Math.ceil(prim.length/2)+1)*21+6 : 0) + (bk.length ? (Math.ceil(bk.length/2)+1)*21+6 : 0);
    if(y + est > H - 40 && est < H - 110){ doc.addPage(); y = 50; }
    y = sectionTitle(doc, y, TYPE_NAME[t], `${prim.length} assigned${bk.length?', '+bk.length+' backup':''}`);
    const table = (list, head, style) => {
      y = twoUp(doc, y, list, [head,'Assigned to','Out','In'], d=>[lbl(d), d.assignee||'', '', ''], cols, style,
        {styles:{...TABLE.styles, minCellHeight:20, valign:'middle'}, didDrawCell:box}) + 6;
    };
    if(prim.length) table(prim, 'Device', HEAD_LIGHT);
    if(bk.length) table(bk, 'Backup', HEAD_BACKUP);
    y += 16;
  });
  if(!any){ doc.setFontSize(10); doc.setTextColor(120,120,120); doc.text('No gear assigned yet.', 36, y); }
  pdfFooter(doc);
  await saveFile(`ShowGear-${slug(p.code||p.name)}-checklist-${stamp()}.pdf`, doc.output('blob'));

/* QR sheet: the whole board, then one card per production (or just one production) */
async function exportQrPdf(onlyPid){
  busy('Building QR codes…');
  let jsPDF; try{ jsPDF = await pdfLibs(); }catch(e){ toast('Couldn’t load the PDF tools. Check your connection.', true); return; }
  const doc = new jsPDF({unit:'pt', format:'letter'});
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  const bigCard = (title, sub, url, color) => {
    if(color){ doc.setFillColor(...hexRgb(color)); doc.rect(0, 0, W, 18, 'F'); doc.setDrawColor(200,200,200); doc.setLineWidth(.5); doc.line(0,18,W,18); }
    doc.setTextColor(17,17,17); doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setCharSpace(1.5); doc.text('SHOWGEAR', W/2, 78, {align:'center'}); doc.setCharSpace(0);
    doc.setFontSize(34); doc.text(title, W/2, 120, {align:'center'});
    doc.setFont('helvetica','normal'); doc.setFontSize(12); doc.setTextColor(90,90,90); if(sub) doc.text(sub, W/2, 144, {align:'center'});
    const size = 340; pdfQr(doc, url, (W-size)/2, 176, size);
    doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(17,17,17); doc.text('Scan to see where the gear is', W/2, 176+size+36, {align:'center'});
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(120,120,120); doc.text(url, W/2, 176+size+54, {align:'center'});
  };
  if(onlyPid){
    const p = prodById(onlyPid); if(!p) return;
    bigCard(p.name, [fmtRange(p), p.location].filter(Boolean).join('  /  '), prodUrl(p), p.color);
    await saveFile(`ShowGear-${slug(p.code||p.name)}-QR-${stamp()}.pdf`, doc.output('blob'));
    return;
  }
  bigCard('Gear board', 'Every production and device', APP_URL());
  const prods = activeProds();
  if(prods.length){
    const cw = (W-72-24)/2, ch = (H-64-40-20)/2; let i = 0;
    prods.forEach(p=>{
      if(i % 4 === 0){ doc.addPage(); doc.setTextColor(17,17,17); doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.text('Productions', 36, 44); }
      const col = i % 2, row = Math.floor((i % 4)/2), x = 36 + col*(cw+24), y = 64 + row*(ch+20);
      doc.setDrawColor(200,200,200); doc.setLineWidth(.6); doc.rect(x, y, cw, ch, 'S');
      doc.setFillColor(...hexRgb(p.color)); doc.rect(x, y, cw, 12, 'F'); doc.line(x, y+12, x+cw, y+12);
      doc.setTextColor(17,17,17); doc.setFont('helvetica','bold'); doc.setFontSize(17);
      const nameLines = doc.splitTextToSize(p.name, cw-32).slice(0,2);
      doc.text(nameLines, x+16, y+38);
      let ty = y + 38 + nameLines.length*19;
      doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(90,90,90);
      const sub = doc.splitTextToSize([fmtRange(p), p.location].filter(Boolean).join('  /  '), cw-32).slice(0,2);
      if(sub.length){ doc.text(sub, x+16, ty); ty += sub.length*11; }
      const qs = Math.min(cw-64, y+ch-30-(ty+8)); pdfQr(doc, prodUrl(p), x+(cw-qs)/2, ty+8, qs);
      doc.setFontSize(7); doc.setTextColor(140,140,140); doc.text(prodUrl(p), x+cw/2, y+ch-14, {align:'center'});
      i++;
    });
  }
  pdfFooter(doc);
  await saveFile(`ShowGear-QR-codes-${stamp()}.pdf`, doc.output('blob'));
}

async function exportSummaryPdf(){
  busy('Building PDF…');
  let jsPDF; try{ jsPDF = await pdfLibs(); }catch(e){ toast('Couldn’t load the PDF tools. Check your connection.', true); return; }
  const doc = new jsPDF({unit:'pt', format:'letter'});
  const prods = activeProds();
  pdfHeader(doc, 'Gear summary', `${prods.length} active production${prods.length===1?'':'s'}, ${DB.devices.length} devices`, null, APP_URL());
  let y = 110;
  // inventory totals
  y = sectionTitle(doc, y, 'Inventory');
  doc.autoTable({...TABLE, startY:y, head:[['Type','Owned','Assigned','Backup','Free']],
    body:TYPES.map(t=>{ const all=DB.devices.filter(d=>d.type===t); const a=all.filter(d=>d.status==='assigned').length, b=all.filter(d=>d.status==='backup').length; return [TYPE_NAME[t], all.length, a||'–', b||'–', (all.length-a-b)||'–']; }),
    columnStyles:{0:{fontStyle:'bold'}, 1:{halign:'right'}, 2:{halign:'right'}, 3:{halign:'right'}, 4:{halign:'right'}},
    didParseCell:(c)=>{ if(c.section==='head' && c.column.index>0) c.cell.styles.halign='right'; }});
  y = doc.lastAutoTable.finalY + 28;
  // productions
  y = sectionTitle(doc, y, 'Productions');
  const fmt = (p,c,t) => {
    if(!c[t].a && !c[t].b) return '–';
    const sh = DB.devices.filter(d=>d.type===t && inProd(d,p.id) && d.pids.length>1).length;
    return c[t].a + (c[t].b?` + ${c[t].b} bkp`:'') + (sh?`\n(${sh} shared)`:'');
  };
  doc.autoTable({...TABLE, startY:y, head:[['','Production','Dates','Location','BP','MIC','IFB']],
    body:prods.map(p=>{ const c=countFor(p.id); return ['', p.name, fmtRange(p), p.location||'–', fmt(p,c,'BP'), fmt(p,c,'MIC'), fmt(p,c,'IFB')]; }),
    columnStyles:{0:{cellWidth:8}, 1:{fontStyle:'bold', cellWidth:112}, 2:{cellWidth:94}, 4:{halign:'right', cellWidth:62}, 5:{halign:'right', cellWidth:62}, 6:{halign:'right', cellWidth:62}},
    didParseCell:(c)=>{ if(c.section==='head' && c.column.index>=4) c.cell.styles.halign='right'; },
    didDrawCell:(data)=>{ if(data.section==='body' && data.column.index===0){ const p=prods[data.row.index]; doc.setFillColor(...hexRgb(p.color)); doc.rect(data.cell.x, data.cell.y, data.cell.width, data.cell.height, 'F'); } }});
  y = doc.lastAutoTable.finalY + 28;
  // shared gear: counted once in Inventory, but on every show that uses it
  const groups = {};
  DB.devices.filter(d=>d.pids.length>1).forEach(d=>{ const ps=sortedProds(d); const k=ps.map(x=>x.id).join('|'); (groups[k]=groups[k]||{ps,labels:[]}).labels.push(d.label); });
  const gl = Object.values(groups);
  if(gl.length){
    y = sectionTitle(doc, y, 'Shared gear', 'Counted once in Inventory');
    doc.autoTable({...TABLE, startY:y, head:[['Devices','Shared by']],
      body:gl.map(g=>[labelRanges(g.labels), g.ps.map(x=>x.name).join(' + ')]), headStyles:{...TABLE.headStyles, ...HEAD_LIGHT},
      columnStyles:{0:{cellWidth:170, fontStyle:'bold'}}});
    y = doc.lastAutoTable.finalY + 28;
  }
  // unassigned pool
  y = sectionTitle(doc, y, 'Unassigned', 'On the shelf');
  doc.autoTable({...TABLE, startY:y, head:[['Type','Devices']],
    body:TYPES.map(t=>{ const l=DB.devices.filter(d=>d.type===t && d.status==='unassigned').sort(byLabel).map(d=>d.label); return [TYPE_NAME[t]+` (${l.length})`, labelRanges(l)||'None']; }),
    columnStyles:{0:{cellWidth:90, fontStyle:'bold'}}});
  pdfFooter(doc);
  await saveFile(`ShowGear-summary-${stamp()}.pdf`, doc.output('blob'));
}

/* ── AUTO-LOCK after 10 idle minutes ── */
const IDLE_MS = 10*60*1000;
let lastActive = Date.now();
['pointerdown','keydown','scroll','touchstart'].forEach(ev=>document.addEventListener(ev, ()=>{ lastActive = Date.now(); }, {passive:true, capture:true}));
function checkIdle(){
  if(UI.edit && Date.now()-lastActive > IDLE_MS){
    UI.edit=false; UI.selecting=false; UI.sel.clear(); closeModal(); render(); toast('Locked after 10 minutes idle');
  }
}
setInterval(checkIdle, 30000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkIdle(); });

/* ════════════════════════════════════════════════════════════
   EVENTS
   ════════════════════════════════════════════════════════════ */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-action]'); if(!el) return;
  const a = el.dataset.action, id = el.dataset.id;
  switch(a){
    case 'tab': UI.tab = el.dataset.tab; if(UI.tab!=='inventory'){UI.selecting=false;UI.sel.clear();} UI.mx.range=false; UI.mx.anchor=null; $('#main').scrollTop=0; render(); break;
    case 'mx-cell': if(UI.edit) mxTap(id, el.dataset.p); break;
    case 'mx-tab': UI.mx.type = el.dataset.t; UI.mx.anchor = null; $('#main').scrollTop = 0; render(); break;
    case 'mx-range': UI.mx.range = !UI.mx.range; UI.mx.anchor = null; render(); if(UI.mx.range) toast('Range: tap the first cell, then the last'); break;

    case 'toggle-mode':
      if(UI.edit){ UI.edit=false; UI.selecting=false; UI.sel.clear(); UI.mx.range=false; UI.mx.anchor=null; render(); toast('Locked. View only.'); }
      else openPin();
      break;
    case 'close-modal': closeModal(); break;
    case 'toggle-prod': UI.open[id] = !el.closest('.psec').classList.contains('open'); saveUI(); render(); break;
    case 'pick-gear': openPicker(id); break;
    case 'export': openExport(); break;
    case 'more': openMore(); break;
    case 'filters': openFilters(); break;
    case 'jump': {
      UI.open[id]=true; saveUI(); render();
      const sec = document.getElementById('ps-'+id), main=$('#main');
      if(sec) main.scrollTo({top: sec.offsetTop - (document.querySelector('.jump')?.offsetHeight||0) - 8, behavior: matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});
      break;
    }
    case 'export-prod': if($('#overlay').classList.contains('show')) closeModal(); exportProdPdf(id); break;
    case 'show-qr': openQr(id); break;
    case 'toggle-archived': UI.showArchived=!UI.showArchived; render(); break;
    case 'open-dev': openDevice(id); break;
    case 'open-prod': openProduction(id); break;
    case 'new-prod': openProduction(null); break;
    case 'add-devices': openAddDevices(); break;
    case 'row':
      if(UI.selecting){ UI.sel.has(id)?UI.sel.delete(id):UI.sel.add(id); render(); }
      else openDevice(id);
      break;
    case 'filter': UI.f[el.dataset.g] = el.dataset.v; render(); break;
    case 'clear-filters': UI.f={q:'',type:'all',status:'all',prod:'all'}; render(); break;
    case 'toggle-select': UI.selecting=!UI.selecting; UI.sel.clear(); render(); break;
    case 'select-all': {
      const list = filteredDevices(); const all = list.every(d=>UI.sel.has(d.id));
      list.forEach(d=> all?UI.sel.delete(d.id):UI.sel.add(d.id)); render(); break;
    }
    case 'bulk-assign': openBulkAssign(); break;
    case 'bulk-unassign': {
      const list = DB.devices.filter(d=>UI.sel.has(d.id)).sort(byLabel);
      confirmModal({title:`Unassign ${list.length}?`, body:'They go back on the shelf with no production or assignee.', confirm:'Unassign'}, ()=>{
        list.forEach(d=>setDeviceState(d,'unassigned',null,''));
        logEvent(`${compactLabels(list.map(d=>d.label))} unassigned`); UI.sel.clear(); save(); render(); toast(`${list.length} unassigned`);
      }); break;
    }
    case 'bulk-delete': {
      const list = DB.devices.filter(d=>UI.sel.has(d.id)).sort(byLabel);
      confirmModal({title:`Delete ${list.length} device${list.length===1?'':'s'}?`, body:'They’re removed from inventory. This can’t be undone.', confirm:'Delete', danger:true}, ()=>{
        UI.sel.forEach(markDelDev); DB.devices = DB.devices.filter(d=>!UI.sel.has(d.id));
        logEvent(`${compactLabels(list.map(d=>d.label))} deleted`); UI.sel.clear(); save(); render(); toast(`${list.length} deleted`);
      }); break;
    }
    case 'clear-log': confirmModal({title:'Clear the log?', body:'Change history is removed. Devices and productions stay.', confirm:'Clear log', danger:true}, async ()=>{
      const r = await SB.from('gear_log').delete().not('id','is',null);
      if(r.error){ console.error(r.error); toast('Couldn’t clear the log', true); return; }
      DB.log=[]; render(); toast('Log cleared');
    }); break;
    case 'retry-load': boot(); break;
    case 'sign-out': (async ()=>{
      try{ await SB.auth.signOut(); }catch(e){}
      UI.user=null; UI.role=null; UI.edit=false; UI.selecting=false; UI.sel.clear(); render(); toast('Signed out');
    })(); break;
  }
});

$('#overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeModal(); });
document.addEventListener('input', e=>{
  if(e.target.id==='mxq'){
    UI.mx.q = e.target.value;
    const pos = e.target.selectionStart; render();
    const q = $('#mxq'); q.focus(); try{ q.setSelectionRange(pos,pos); }catch(_){}
    return;
  }
  if(e.target.id==='q'){
    UI.f.q = e.target.value;
    const pos = e.target.selectionStart; render();
    const q = $('#q'); q.focus(); try{ q.setSelectionRange(pos,pos); }catch(_){}
  }
});
document.addEventListener('change', e=>{ if(e.target.id==='prodFilter'){ UI.f.prod = e.target.value; render(); } });

let bootedRealtime = false;
async function boot(){
  UI.loadError = null; render();
  try{ await loadAll(); UI.loaded = true; }
  catch(e){ console.error('ShowGear load failed:', e); UI.loadError = e; render(); return; }
  applyDeepLink(); render();
  if(!SB || bootedRealtime) return;
  bootedRealtime = true;
  try{ const {data} = await SB.auth.getSession(); if(data && data.session){ await refreshRole(data.session.user); render(); } }catch(e){}
  let t = null;
  const refresh = () => { clearTimeout(t); t = setTimeout(async ()=>{
    if(hasDirty()) return; // don't clobber an edit that's still saving
    try{ await loadAll(); UI.loaded = true; UI.loadError = null; }catch(e){ return; }
    const a = document.activeElement; // don't yank focus from someone typing in search
    if(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && $('#main').contains(a)) return;
    render();
  }, 300); };
  SB.channel('showgear-rt')
    .on('postgres_changes',{event:'*',schema:'public',table:'gear_devices'},refresh)
    .on('postgres_changes',{event:'*',schema:'public',table:'gear_productions'},refresh)
    .on('postgres_changes',{event:'*',schema:'public',table:'gear_log'},refresh)
    .subscribe((status)=>console.log('[ShowGear realtime]', status));
  setInterval(()=>{ if(!document.hidden) refresh(); }, 30000); // safety net if realtime drops
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) refresh(); });
}
boot();
})();
</script>
</body>
</html>
